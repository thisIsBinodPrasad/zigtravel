<header class="site-header">
  <div class="top-bar">
    <div class="container top-bar-content">
      <span class="top-bar-msg"><i class="ri-shield-check-line"></i> Best Price Guarantee &middot; 24/7 On-Trip Assistance</span>
      <div class="top-bar-contact">
        <a href="mailto:Sales@zigoholidays.com"><i class="ri-mail-line"></i> Sales@zigoholidays.com</a>
        <a href="tel:+918970034810"><i class="ri-phone-line"></i> +91 8970034810</a>
      </div>
    </div>
  </div>

  <nav class="navbar">
    <div class="container nav-wrapper">
      <a href="#" class="brand-logo">
        <div class="logo-icon"><i class="ri-compass-3-fill"></i></div>
        <div class="logo-text">
          <span class="brand-name">Zigo<span class="highlight">Holidays</span></span>
          <span class="brand-sub">DOMESTIC &amp; INTERNATIONAL HOLIDAYS</span>
        </div>
      </a>

      <div class="nav-menu" [class.active]="isMobileMenuOpen">
        <!-- Domestic / International tabs -->
        <div class="region-tabs" role="tablist" aria-label="Trip type">
          <button
            *ngFor="let t of tabs"
            type="button"
            role="tab"
            class="region-tab"
            [class.active]="activeRegion === t.id"
            [attr.aria-selected]="activeRegion === t.id"
            (click)="selectRegion(t.id)">
            <i [class]="t.icon"></i> {{ t.label }}
          </button>
        </div>

        <div class="nav-links">
          <a href="#packages-section" class="nav-link" (click)="isMobileMenuOpen = false">Packages</a>
          <a href="#travel-guide-section" class="nav-link" (click)="isMobileMenuOpen = false">Seasonal Guide</a>
          <a href="#reviews-section" class="nav-link" (click)="isMobileMenuOpen = false">Reviews</a>
          <a href="#faq-section" class="nav-link" (click)="isMobileMenuOpen = false">FAQs</a>
        </div>

        <button class="btn-primary mobile-cta" (click)="openGeneralInquiry()">
          <i class="ri-magic-line"></i> Get your trip customized
        </button>
      </div>

      <div class="nav-actions">
        <button class="btn-primary desktop-cta" (click)="openGeneralInquiry()">
          <i class="ri-magic-line"></i> Get your trip customized
        </button>
        <button class="hamburger-btn" (click)="toggleMobileMenu()" aria-label="Toggle menu">
          <i [class]="isMobileMenuOpen ? 'ri-close-line' : 'ri-menu-3-line'"></i>
        </button>
      </div>
    </div>
  </nav>
</header>
